name: Checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
            requirements-analysis.txt
            requirements-figures.txt
      - name: Install dependencies and restore snapshot
        run: |
          python -m venv .venv
          source .venv/bin/activate
          bash scripts/install.sh --dev
      - name: Check syntax and package
        run: |
          source .venv/bin/activate
          bash scripts/lint.sh
          python scripts/verify_project.py
      - name: Reproduce registered assessment analyses
        run: |
          source .venv/bin/activate
          python -m pip install -r requirements-analysis.txt
          python scripts/reproduce_assessment_analysis.py --output-dir /tmp/ipcc-assessment-reproduction --check-reference
      - name: Save reproduction record
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assessment-reproduction-${{ matrix.python-version }}
          path: |
            /tmp/ipcc-assessment-reproduction/reproduction.json
            /tmp/ipcc-assessment-reproduction/step_*.log
      - name: Check API and run tests
        run: |
          source .venv/bin/activate
          bash scripts/dev.sh > /tmp/ipcc-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8077/api/health', timeout=2)
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('API did not start')
          PY
          python scripts/verify_project.py --require-api
          bash scripts/test.sh --ignore=tests/test_frontend_smoke.py

  figures:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-analysis.txt
            requirements-figures.txt
      - name: Install figure dependencies and pinned QA tools
        run: |
          python -m pip install -r requirements-figures.txt
          git clone --filter=blob:none https://github.com/Yuan1z0825/nature-skills /tmp/ipcc-nature-qa
          git -C /tmp/ipcc-nature-qa checkout e605b35611ab2849af46d0cf7831aefdcf85be07
      - name: Render and audit assessment figures
        run: |
          python reproducibility/make_assessment_figures.py \
            --results-dir reproducibility/reference \
            --output-dir /tmp/ipcc-assessment-figures \
            --qc-dir /tmp/ipcc-assessment-figure-checks \
            --skill-directory /tmp/ipcc-nature-qa/skills/nature-figure
